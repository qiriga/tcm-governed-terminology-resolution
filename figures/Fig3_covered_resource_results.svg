<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><style>
.title{font:700 31px Arial,sans-serif;fill:#111}.head{font:700 22px Arial,sans-serif;fill:#111}.big{font:700 30px Arial,sans-serif;fill:#111}.txt{font:18px Arial,sans-serif;fill:#111}.small{font:15px Arial,sans-serif;fill:#222}.blocklabel{font:18px Arial,sans-serif;fill:#111}.blockvalue{font:700 30px Arial,sans-serif;fill:#111}.blockresult{font:700 21px Arial,sans-serif;fill:#111}.callouttext{font:700 16px Arial,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:2.5}.callout{fill:#fff;stroke:#111;stroke-width:3}.gray{fill:#d2d2d2;stroke:#111;stroke-width:2.5}.dark{fill:#9d9d9d;stroke:#111;stroke-width:2.5}.hatch{fill:url(#hatch);stroke:#111;stroke-width:2.5}.unsafe{fill:#222;stroke:#111;stroke-width:1.5}.line{stroke:#111;stroke-width:3}.dash{stroke:#111;stroke-width:2;stroke-dasharray:9 7}
</style><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#aaa" stroke-width="3"/></pattern></defs>
<rect width="1600" height="1050" fill="#fff"/><text x="800" y="44" text-anchor="middle" class="title">Covered-resource benchmark as a selective-resolution operating point</text>

<rect x="70" y="78" width="1460" height="320" rx="7" class="box"/><text x="105" y="116" class="head">A. System-level disposition</text>
<text x="105" y="151" class="txt">Total queries: 1,855</text>
<rect x="105" y="170" width="1104" height="70" class="gray"/><rect x="1209" y="170" width="356" height="70" class="hatch"/>
<text x="657" y="213" text-anchor="middle" class="big">1,403 automatic resolutions</text><text x="1387" y="201" text-anchor="middle" class="head">452</text><text x="1387" y="226" text-anchor="middle" class="small">review / abstention</text>

<text x="105" y="280" class="head">Among 1,403 automatic resolutions</text>
<rect x="105" y="300" width="1457" height="58" class="dark"/><rect x="1559" y="300" width="3" height="58" class="unsafe"/>
<text x="800" y="336" text-anchor="middle" class="head">1,400 correct automatic resolutions</text>
<circle cx="1560" cy="300" r="6" fill="#111"/><line x1="1555" y1="297" x2="1495" y2="271" class="line"/><rect x="1255" y="242" width="240" height="43" rx="4" class="callout"/><text x="1375" y="269" text-anchor="middle" class="callouttext">3 unsafe automatic resolutions</text>
<text x="800" y="382" text-anchor="middle" class="small">Automatic coverage first; automatic-resolution correctness is conditional on automatic resolution.</text>

<rect x="70" y="430" width="1460" height="460" rx="7" class="box"/><text x="105" y="470" class="head">B. Group-level operating behavior</text>
<text x="330" y="512" text-anchor="middle" class="head">B1</text><text x="680" y="512" text-anchor="middle" class="head">B2</text><text x="1030" y="512" text-anchor="middle" class="head">B3</text><text x="1380" y="512" text-anchor="middle" class="head">B4</text>
<rect x="165" y="540" width="330" height="235" rx="5" class="gray"/><text x="330" y="578" text-anchor="middle" class="blocklabel">Exact main names</text><text x="330" y="628" text-anchor="middle" class="blockvalue">600 / 600</text><text x="330" y="657" text-anchor="middle" class="small">automatic coverage</text><text x="330" y="708" text-anchor="middle" class="blockresult">600 / 600 correct</text><text x="330" y="747" text-anchor="middle" class="small">review / abstention 0 • unsafe 0</text>
<rect x="515" y="540" width="330" height="235" rx="5" class="gray"/><text x="680" y="578" text-anchor="middle" class="blocklabel">Verified aliases</text><text x="680" y="628" text-anchor="middle" class="blockvalue">600 / 600</text><text x="680" y="657" text-anchor="middle" class="small">automatic coverage</text><text x="680" y="708" text-anchor="middle" class="blockresult">600 / 600 correct</text><text x="680" y="747" text-anchor="middle" class="small">review / abstention 0 • unsafe 0</text>
<rect x="865" y="540" width="330" height="235" rx="5" class="box"/><text x="1030" y="578" text-anchor="middle" class="blocklabel">Controlled perturbations</text><text x="1030" y="628" text-anchor="middle" class="blockvalue">203 / 600</text><text x="1030" y="657" text-anchor="middle" class="small">automatic coverage</text><text x="1030" y="708" text-anchor="middle" class="blockresult">200 correct • 3 unsafe</text><text x="1030" y="747" text-anchor="middle" class="small">review / abstention 397</text>
<rect x="1215" y="540" width="330" height="235" rx="5" class="hatch"/><text x="1380" y="578" text-anchor="middle" class="blocklabel">Ambiguous / unsupported</text><text x="1380" y="628" text-anchor="middle" class="blockvalue">0 / 55</text><text x="1380" y="657" text-anchor="middle" class="small">automatic coverage</text><text x="1380" y="708" text-anchor="middle" class="blockresult">55 / 55 abstained</text><text x="1380" y="747" text-anchor="middle" class="small">unsafe 0</text>
<line x1="165" y1="815" x2="1545" y2="815" class="dash"/><text x="800" y="850" text-anchor="middle" class="txt">B3 candidate retrieval: Top-1 449/600 • Top-20 527/600</text>

<rect x="180" y="925" width="1240" height="80" rx="6" class="box"/><text x="800" y="958" text-anchor="middle" class="head">Covered-resource behavior ≠ unseen generalization</text><text x="800" y="987" text-anchor="middle" class="small">Selective automation combines automatic coverage, automatic-resolution correctness, review / abstention, unsafe automatic resolution, and provenance.</text>
</svg>