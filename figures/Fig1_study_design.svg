<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#111}.head{font:700 22px Arial,sans-serif;fill:#111}
      .sub{font:700 17px Arial,sans-serif;fill:#111}.txt{font:15px Arial,sans-serif;fill:#111}
      .small{font:13px Arial,sans-serif;fill:#222}.metric{font:15px Arial,sans-serif;fill:#111;font-variant-numeric:tabular-nums}.box{fill:#fff;stroke:#111;stroke-width:2}
      .gray{fill:#e5e5e5;stroke:#111;stroke-width:2}.dark{fill:#c4c4c4;stroke:#111;stroke-width:2}
      .dash{fill:#f8f8f8;stroke:#111;stroke-width:2;stroke-dasharray:9 7}.arrow{stroke:#111;stroke-width:2.2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#111"/></marker>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#aaa" stroke-width="3"/></pattern>
  </defs>
  <rect width="1400" height="1040" fill="white"/>
  <text x="700" y="38" text-anchor="middle" class="title">Failure-guided study design and separated evaluation tracks</text>
  <rect x="35" y="65" width="635" height="790" class="box"/>
  <rect x="730" y="65" width="635" height="790" class="dash"/>
  <text x="352" y="98" text-anchor="middle" class="head">GENERALIZATION TRACK</text>
  <text x="1047" y="98" text-anchor="middle" class="head">COVERED-RESOURCE TRACK</text>
  <rect x="85" y="125" width="535" height="78" class="gray" rx="5"/>
  <text x="352" y="151" text-anchor="middle" class="sub">Frozen split</text>
  <text x="352" y="176" text-anchor="middle" class="txt">Train 2,510  |  Validation 358  |  Sealed test 717</text>
  <text x="352" y="195" text-anchor="middle" class="small">Sealed test untouched</text>
  <path d="M352 203 L352 228" class="arrow"/>
  <rect x="85" y="230" width="535" height="110" class="box" rx="5"/>
  <text x="110" y="257" class="sub">RQ1  Generative LoRA</text>
  <text x="110" y="282" class="txt">Form learned: 351/358 structurally complete</text>
  <text x="110" y="306" class="txt">Mapping not reliable: 0/358 exact</text>
  <text x="110" y="329" class="small">Development-validation behavior</text>
  <path d="M352 340 L352 365" class="arrow"/>
  <rect x="85" y="367" width="535" height="157" class="box" rx="5"/>
  <text x="110" y="394" class="sub">RQ2  Train-only retrieval</text>
  <text x="110" y="420" class="txt">Candidate reachability: L0 / L1 / L2 / L3</text>
  <text x="110" y="444" class="txt">0 / 21 / 221 / 116</text>
  <text x="110" y="470" class="txt">Genus signal improved</text>
  <text x="110" y="494" class="txt">Complete-label coverage ceiling: 0/358</text>
  <text x="110" y="516" class="small">Availability separated from ranking</text>
  <path d="M352 524 L352 549" class="arrow"/>
  <rect x="85" y="551" width="535" height="145" class="box" rx="5"/>
  <text x="110" y="578" class="sub">RQ3  Constraint diagnostics</text>
  <text x="110" y="605" class="txt">Soft context → hard prefixes → oracle diagnostics</text>
  <text x="110" y="634" class="txt">Constraint compliance ≠ knowledge acquisition</text>
  <text x="110" y="661" class="small">Oracles diagnose completion; not system performance</text>
  <rect x="100" y="731" width="505" height="82" fill="url(#hatch)" stroke="#111" stroke-width="2"/>
  <text x="352" y="759" text-anchor="middle" class="sub">TASK-FORMULATION PIVOT</text>
  <text x="352" y="789" text-anchor="middle" class="txt">Do not regenerate authoritative terminology facts</text>

  <rect x="780" y="125" width="535" height="78" class="gray" rx="5"/>
  <text x="1047" y="154" text-anchor="middle" class="sub">Audited terminology knowledge base</text>
  <text x="1047" y="181" text-anchor="middle" class="txt">3,593 terminology records</text>
  <path d="M1047 203 L1047 228" class="arrow"/>
  <rect x="780" y="230" width="535" height="190" class="box" rx="5"/>
  <text x="805" y="257" class="sub">RQ4  Governed resolution chain</text>
  <text x="805" y="286" class="txt">Exact main → verified alias → normalized match</text>
  <text x="805" y="319" class="txt">Fuzzy retrieval → candidate only</text>
  <text x="805" y="352" class="txt">Ambiguous / unsupported → abstain</text>
  <text x="805" y="385" class="small">Latin output only from unique immutable KB records</text>
  <path d="M1047 420 L1047 445" class="arrow"/>
  <rect x="780" y="447" width="535" height="249" class="dark" rx="5"/>
  <text x="805" y="478" class="sub">Frozen covered-resource benchmark</text>
  <text x="805" y="510" class="metric">Automatic-resolution correctness: 1,400 / 1,403</text>
  <text x="805" y="543" class="metric">Automatic coverage: 1,403 / 1,855</text>
  <text x="805" y="576" class="metric">Review / abstention: 452 / 1,855</text>
  <text x="805" y="609" class="metric">Unsafe automatic resolution: 3 / 1,855</text>
  <text x="805" y="642" class="metric">Provenance complete: 1,403 / 1,403</text>
  <text x="805" y="675" class="small">Covered-resource performance ≠ unseen generalization</text>
  <rect x="780" y="731" width="535" height="82" class="dash" rx="5"/>
  <text x="1047" y="759" text-anchor="middle" class="sub">Abstain / human review</text>
  <text x="1047" y="789" text-anchor="middle" class="txt">for ambiguity, unsupported input, or fuzzy candidates</text>
  <path d="M670 772 L730 772" class="arrow"/>

  <rect x="150" y="885" width="1100" height="120" class="box" rx="5"/>
  <text x="700" y="916" text-anchor="middle" class="head">Knowledge base = factual authority</text>
  <text x="700" y="948" text-anchor="middle" class="txt">Future LLM roles: query reformulation  |  candidate explanation  |  interactive clarification</text>
  <text x="700" y="980" text-anchor="middle" class="sub">NOT Latin-name factual generation</text>
</svg>
