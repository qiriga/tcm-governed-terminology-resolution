[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "tcm-governed-terminology-resolution"
version = "0.1.0"
description = "Copyright-safe governed record-resolution reproducibility tooling"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
